html[data-aquila-top-deck-finalizing-r41="1"]
nav.ubuzima-workspace-dock-v5[
    data-ubuzima-workspace-dock-v5="UBIZIMA_CONTINUOUS_MAC_WORKSPACE_DOCK_V7"
] {
    opacity: 0 !important;
    pointer-events: none !important;

<script data-aquila-top-menu-deck-final-paint="r41">
(() => {
    "use strict";

    const RELEASE =
        "AQUILA_TOP_MENU_DECK_FINAL_PAINT_R41";

    const ROOT_ATTR =
        "data-aquila-top-deck-finalizing-r41";

    const BUILD =
        "UBIZIMA_CONTINUOUS_MAC_WORKSPACE_DOCK_V7";

    const DECK_SELECTOR =
        'nav.ubuzima-workspace-dock-v5' +
        '[data-ubuzima-workspace-dock-v5="' +
        BUILD +
        '"]';

    const LANE_ID =
        "aquila-menu-deck-header-lane-r9";

    const OWNER_RELEASE =
        "AQUILA-MENU-DECK-V7-FLOW-BOUNDARY-R9";

    const REQUIRED_STABLE_FRAMES = 3;

    const TOP_TOLERANCE_PX = 2.5;
    const CENTER_TOLERANCE_PX = 3.0;

    let frame = 0;
    let failSafe = 0;
    let stableFrames = 0;

    let lastState = null;

    if (
        window.__AQUILA_TOP_MENU_DECK_FINAL_PAINT_R41__
        ?.release === RELEASE
    ) {
        return;
    }

    function deck() {
        return document.querySelector(
            DECK_SELECTOR
        );
    }

    function lane() {
        return document.getElementById(
            LANE_ID
        );
    }

    function owner() {
        return window.__AQUILA_DECK_R9__;
    }

    function visible(element) {
        if (!(element instanceof Element)) {
            return false;
        }

        const style =
            getComputedStyle(element);

        const rect =
            element.getBoundingClientRect();

        return (
            style.display !== "none"
            &&
            style.visibility !== "hidden"
            &&
            rect.width > 0
            &&
            rect.height > 0
        );
    }

    function expectedTop() {
        return (
            window.innerWidth <= 767
                ? 6
                : 10
        );
    }

    function mobileHiddenIsValid(element) {
        return (
            window.innerWidth <= 767
            &&
            element instanceof Element
            &&
            !visible(element)
        );
    }

    function ownerReady(element) {
        const api =
            owner();

        const headerLane =
            lane();

        return Boolean(
            element
            &&
            api
            &&
            api.release === OWNER_RELEASE
            &&
            typeof api.apply === "function"
            &&
            typeof api.diagnose === "function"
            &&
            element.hasAttribute(
                "data-aquila-deck-r9"
            )
            &&
            headerLane
            &&
            headerLane.hasAttribute(
                "data-aquila-deck-lane"
            )
        );
    }

    function diagnosticState() {
        const api =
            owner();

        if (
            !api
            ||
            typeof api.diagnose !== "function"
        ) {
            return null;
        }

        try {
            return api.diagnose();
        } catch (_) {
            return null;
        }
    }

    function geometryState() {
        const element =
            deck();

        if (!element) {
            return {
                ready: false,
                reason: "deck-not-mounted",
            };
        }

        if (
            mobileHiddenIsValid(
                element
            )
        ) {
            return {
                ready: true,
                mobileHidden: true,
                reason:
                    "desktop-v7-deck-intentionally-hidden-on-mobile",
            };
        }

        if (!visible(element)) {
            return {
                ready: false,
                reason: "deck-not-visible",
            };
        }

        if (!ownerReady(element)) {
            return {
                ready: false,
                reason:
                    "r9-owner-or-header-lane-not-ready",
            };
        }

        const rect =
            element.getBoundingClientRect();

        const targetTop =
            expectedTop();

        const actualCenter =
            rect.left
            +
            (
                rect.width / 2
            );

        const viewportCenter =
            window.innerWidth / 2;

        const topDelta =
            Math.abs(
                rect.top
                -
                targetTop
            );

        const centerDelta =
            Math.abs(
                actualCenter
                -
                viewportCenter
            );

        const diag =
            diagnosticState();

        const diagnosticTopValid =
            !diag
            ||
            !Number.isFinite(
                Number(
                    diag.deckTop
                )
            )
            ||
            Math.abs(
                Number(
                    diag.deckTop
                )
                -
                targetTop
            ) <= TOP_TOLERANCE_PX;

        const diagnosticVisibleValid =
            !diag
            ||
            diag.deckVisible !== false;

        const ready =
            topDelta <= TOP_TOLERANCE_PX
            &&
            centerDelta <= CENTER_TOLERANCE_PX
            &&
            diagnosticTopValid
            &&
            diagnosticVisibleValid;

        return {
            ready,
            reason:
                ready
                    ? "final-r9-geometry"
                    : "geometry-not-final",

            targetTop,
            deckTop:
                rect.top,

            deckBottom:
                rect.bottom,

            deckLeft:
                rect.left,

            deckWidth:
                rect.width,

            actualCenter,
            viewportCenter,
            topDelta,
            centerDelta,

            ownerAttribute:
                element.getAttribute(
                    "data-aquila-deck-r9"
                ),

            lanePresent:
                Boolean(
                    lane()
                ),

            laneOwned:
                Boolean(
                    lane()
                    ?.hasAttribute(
                        "data-aquila-deck-lane"
                    )
                ),

            diagnostic:
                diag,
        };
    }

    function release(reason) {
        document.documentElement
            .removeAttribute(
                ROOT_ATTR
            );

        stableFrames = 0;

        if (frame) {
            cancelAnimationFrame(
                frame
            );

            frame = 0;
        }

        if (failSafe) {
            clearTimeout(
                failSafe
            );

            failSafe = 0;
        }

        lastState = {
            ...(
                geometryState()
            ),
            released:
                true,

            releaseReason:
                reason,
        };
    }

    function watch() {
        const state =
            geometryState();

        lastState =
            state;

        if (state.ready) {
            stableFrames += 1;
        } else {
            stableFrames = 0;
        }

        if (
            stableFrames
            >=
            REQUIRED_STABLE_FRAMES
        ) {
            release(
                "stable-final-r9-geometry"
            );

            return;
        }

        frame =
            requestAnimationFrame(
                watch
            );
    }

    function engage(reason) {
        document.documentElement
            .setAttribute(
                ROOT_ATTR,
                "1"
            );

        stableFrames = 0;

        lastState = {
            reason,
            pending: true,
        };

        if (frame) {
            cancelAnimationFrame(
                frame
            );
        }

        frame =
            requestAnimationFrame(
                watch
            );

        if (failSafe) {
            clearTimeout(
                failSafe
            );
        }

        /*
         * Fail-safe only.
         * Never leave the navigation permanently invisible
         * if the existing R9 owner itself fails.
         */
        failSafe =
            setTimeout(
                () => {
                    release(
                        "failsafe-timeout"
                    );
                },
                6000
            );
    }

    function navigationControl(
        event
    ) {
        const target =
            event.target
            instanceof Element
                ? event.target.closest(
                    'button,a,[role="button"],[role="tab"]'
                )
                : null;

        if (!target) {
            return false;
        }

        if (
            target.closest(
                DECK_SELECTOR
            )
        ) {
            /*
             * AQUILA R45
             *
             * A click inside the Top Menu Deck must never pre-hide
             * the Deck itself.
             *
             * R41 previously returned true here, which caused the
             * capture-phase click handler to call engage() before
             * navigation completed. That set the R41 finalizing
             * attribute and temporarily reduced the Deck to opacity 0.
             *
             * Genuine route changes remain covered by hashchange,
             * popstate and pageshow. The R9 Deck owner remains the
             * only geometry authority.
             */
            return false;
        }

        if (
            target.closest(
                '[data-principal-menu] > button[data-section]'
            )
        ) {
            return true;
        }

        return false;
    }

    /*
     * Hide BEFORE React/native navigation can remount or
     * temporarily reposition the Deck.
     */
    document.addEventListener(
        "click",
        event => {
            if (
                navigationControl(
                    event
                )
            ) {
                engage(
                    "navigation-click"
                );
            }
        },
        true
    );

    window.addEventListener(
        "hashchange",
        () => {
            /*
             * AQUILA R46 — ROUTE STABILITY
             *
             * The V7 Top Menu Deck is already mounted and owned by R9.
             * A route hash change must therefore NOT make an already
             * stable navigation surface transparent.
             *
             * R9 remains responsible for geometry and active-state
             * reconciliation after route changes.
             */
            lastState = {
                reason:
                    "hashchange-observed-no-deck-hide",

                pending:
                    document.documentElement
                        .hasAttribute(
                            ROOT_ATTR
                        ),
            };
        },
        {
            passive: true,
        }
    );

    window.addEventListener(
        "popstate",
        () => {
            /*
             * AQUILA R46 — HISTORY STABILITY
             *
             * Browser Back/Forward must not temporarily hide an
             * already-mounted Top Menu Deck.
             */
            lastState = {
                reason:
                    "popstate-observed-no-deck-hide",

                pending:
                    document.documentElement
                        .hasAttribute(
                            ROOT_ATTR
                        ),
            };
        },
        {
            passive: true,
        }
    );

    window.addEventListener(
        "pageshow",
        () => {
            engage(
                "pageshow"
            );
        },
        {
            passive: true,
        }
    );

    window.addEventListener(
        "resize",
        () => {
            engage(
                "resize"
            );
        },
        {
            passive: true,
        }
    );

    window.addEventListener(
        "orientationchange",
        () => {
            engage(
                "orientationchange"
            );
        },
        {
            passive: true,
        }
    );

    /*
     * First paint protection:
     * this script is inserted immediately after <head>.
     */
    document.documentElement
        .setAttribute(
            ROOT_ATTR,
            "1"
        );

    if (
        document.readyState
        ===
        "loading"
    ) {
        document.addEventListener(
            "DOMContentLoaded",
            () => {
                engage(
                    "dom-ready"
                );
            },
            {
                once: true,
            }
        );
    } else {
        engage(
            "script-ready"
        );
    }

    window.__AQUILA_TOP_MENU_DECK_FINAL_PAINT_R41__ =
        Object.freeze({
            release:
                RELEASE,

            status() {
                return {
                    pending:
                        document.documentElement
                            .hasAttribute(
                                ROOT_ATTR
                            ),

                    stableFrames,
                    requiredStableFrames:
                        REQUIRED_STABLE_FRAMES,

                    ...geometryState(),

                    lastState,
                };
            },
        });
})();

</script>
<style id="aquila-finance-overview-final-state-r40-style">

<script data-aquila-finance-overview-final-state="r40">
(() => {
    "use strict";

    const RELEASE =
        "AQUILA_FINANCE_OVERVIEW_FINAL_STATE_R40";

    const ATTR =
        "data-aquila-finance-overview-finalizing";

    if (
        window.__AQUILA_FINANCE_OVERVIEW_FINAL_STATE_R40__
        ?.release === RELEASE
    ) {
        return;
    }

    let frame = 0;
    let failSafe = 0;

    function params() {
        try {
            return new URLSearchParams(
                String(
                    location.hash || ""
                ).replace(
                    /^#/,
                    ""
                )
            );
        } catch (_) {
            return new URLSearchParams();
        }
    }

    function overviewRoute() {
        const p = params();

        return (
            p.get("section") === "finance"
            &&
            (
                !p.get("finance")
                ||
                p.get("finance") === "overview"
            )
        );
    }

    function root() {
        return document.querySelector(
            ".finance-reference-v1"
        );
    }

    function dataBound(node) {
        return Boolean(
            node
            &&
            node.getAttribute(
                "data-aquila-finance-overview-r2-5"
            ) === "bound"
        );
    }

    function visuallyPolished(node) {
        return Boolean(
            node
            &&
            node.getAttribute(
                "data-aquila-finance-visual-polish-r2-6"
            ) === "active"
        );
    }

    function lifecycleDone() {
        const api =
            window.__AQUILA_FINANCE_OVERVIEW_R29__;

        if (
            !api
            ||
            typeof api.diagnose !== "function"
        ) {
            return false;
        }

        try {
            const state =
                api.diagnose();

            return (
                Number(
                    state?.runs || 0
                ) > 0
            );
        } catch (_) {
            return false;
        }
    }

    function finalReady() {
        const node = root();

        return (
            overviewRoute()
            &&
            dataBound(node)
            &&
            visuallyPolished(node)
            &&
            lifecycleDone()
        );
    }

    function release() {
        document.documentElement
            .removeAttribute(
                ATTR
            );

        if (frame) {
            cancelAnimationFrame(
                frame
            );

            frame = 0;
        }

        if (failSafe) {
            clearTimeout(
                failSafe
            );

            failSafe = 0;
        }
    }

    function watch() {
        if (!overviewRoute()) {
            release();
            return;
        }

        if (finalReady()) {
            release();
            return;
        }

        frame =
            requestAnimationFrame(
                watch
            );
    }

    function engage() {
        if (!overviewRoute()) {
            release();
            return;
        }

        document.documentElement
            .setAttribute(
                ATTR,
                "1"
            );

        if (frame) {
            cancelAnimationFrame(
                frame
            );
        }

        frame =
            requestAnimationFrame(
                watch
            );

        if (failSafe) {
            clearTimeout(
                failSafe
            );
        }

        /*
         * Fail-safe only.
         * It prevents a permanent invisible page if an existing
         * Finance owner fails independently.
         */
        failSafe =
            setTimeout(
                release,
                8000
            );
    }

    function label(value) {
        return String(
            value || ""
        )
            .replace(
                /\s+/g,
                " "
            )
            .trim()
            .toLowerCase();
    }

    /*
     * Capture before React handles an Overview navigation click,
     * so the old/raw state cannot paint between route ownership
     * and the final Finance Overview state.
     */
    document.addEventListener(
        "click",
        event => {
            const target =
                event.target instanceof Element
                    ? event.target.closest(
                        'button,a,[role="button"],[role="tab"]'
                    )
                    : null;

            if (!target) {
                return;
            }

            const text =
                label(
                    target.textContent
                );

            const overviewControl =
                (
                    text === "overview"
                    ||
                    text === "finance overview"
                )
                &&
                Boolean(
                    target.closest(
                        'nav[aria-label="Finance workspace navigation"],'
                        +
                        'nav[aria-label="Finance workspace sections"]'
                    )
                );

            const financePrincipal =
                target.matches(
                    '[data-principal-menu="finance"] > button[data-section="finance"]'
                )
                ||
                Boolean(
                    target.closest(
                        '[data-principal-menu="finance"] > button[data-section="finance"]'
                    )
                );

            if (
                overviewControl
                ||
                financePrincipal
            ) {
                document.documentElement
                    .setAttribute(
                        ATTR,
                        "1"
                    );
            }
        },
        true
    );

    window.addEventListener(
        "hashchange",
        () => {
            if (overviewRoute()) {
                engage();
            } else {
                release();
            }
        },
        {
            passive: true,
        }
    );

    window.addEventListener(
        "popstate",
        () => {
            if (overviewRoute()) {
                engage();
            } else {
                release();
            }
        },
        {
            passive: true,
        }
    );

    window.addEventListener(
        "pageshow",
        () => {
            if (overviewRoute()) {
                engage();
            } else {
                release();
            }
        },
        {
            passive: true,
        }
    );

    /*
     * This script is deliberately placed at first HEAD paint.
     */
    if (overviewRoute()) {
        document.documentElement
            .setAttribute(
                ATTR,
                "1"
            );

        if (
            document.readyState === "loading"
        ) {
            document.addEventListener(
                "DOMContentLoaded",
                engage,
                {
                    once: true,
                }
            );
        } else {
            engage();
        }
    }

    window.__AQUILA_FINANCE_OVERVIEW_FINAL_STATE_R40__ =
        Object.freeze({
            release:
                RELEASE,

            status() {
                const node = root();

                return {
                    route:
                        overviewRoute(),

                    pending:
                        document.documentElement
                            .hasAttribute(
                                ATTR
                            ),

                    rootPresent:
                        Boolean(node),

                    dataBound:
                        dataBound(node),

                    visuallyPolished:
                        visuallyPolished(node),

                    lifecycleDone:
                        lifecycleDone(),

                    finalReady:
                        finalReady(),
                };
            },
        });
})();
</script>

        var PREFERRED = "UBIZIMA_CONTINUOUS_MAC_WORKSPACE_DOCK_V7";
        function isDesktop() {
          return !window.matchMedia || window.matchMedia("(min-width: 768px)").matches;

        function hide(el) {
          if (!el) return;
          el.setAttribute("data-aquila-r109-hidden", "1");
          el.setAttribute("aria-hidden", "true");

        function keep(el) {
          if (!el) return;

          var docks = document.querySelectorAll("nav.ubuzima-workspace-dock-v5");

          var i;
          for (i = 0; i < docks.length; i++) {

              preferred.push(docks[i]);

          var keepList = preferred.length ? preferred : [docks[docks.length - 1]];

    <script>
      (function () {
        var recoveryShown = false;

        function rootNode() {
          return document.getElementById('root');
        }

        function appIsReady() {
          return window.__UBUZIMA_APP_READY__ === true;
        }

        function openSafeMode(reason, delay) {
          window.setTimeout(function () {
            if (!appIsReady()) {
              console.warn('Startup fallback suppressed for stable main admin release.', reason || 'app-startup');
            }
          }, delay || 1200);
        }

        function showRecovery(reason) {
          var root = rootNode();

          if (!root || appIsReady() || recoveryShown) {
            return;
          }

          recoveryShown = true;
          root.innerHTML =
            '<div class="ubuzima-boot-fallback" role="alert" aria-live="assertive">' +
              '<div class="ubuzima-boot-fallback__card">' +
                '<strong>Refresh Ubuzima+</strong>' +
                '<span>' + reason + '</span>' +
                '<div class="ubuzima-boot-fallback__actions">' +
                  '<button type="button" onclick="window.location.reload()">Reload</button>' +
                  '<button class="primary" type="button" onclick="window.ubuzimaClearPwaCache()">Fix app</button>' +
                '</div>' +
              '</div>' +
            '</div>';
        }

        window.ubuzimaClearPwaCache = async function () {
          try {
            if ('serviceWorker' in navigator) {
              var registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(
                registrations
                  .filter(function (registration) {
                    return registration.scope.indexOf('/admin/') !== -1;
                  })
                  .map(function (registration) {
                    return registration.unregister();
                  })
              );
            }

            if ('caches' in window) {
              var keys = await caches.keys();
              await Promise.all(
                keys
                  .filter(function (key) {
                    return key.indexOf('ubuzima-admin-') === 0;
                  })
                  .map(function (key) {
                    return caches.delete(key);
                  })
              );
            }
          } catch (error) {
            console.warn('Unable to clear Ubuzima+ app cache', error);
          }

          window.location.replace('/admin/?fresh=' + Date.now());
        };

        window.addEventListener('ubuzima:app-ready', function () {
          window.__UBUZIMA_APP_READY__ = true;
        });

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            var assetUrl = target && (target.src || target.href);

            if (assetUrl && assetUrl.indexOf('/admin/assets/') !== -1) {
              showRecovery('The installed app could not load its latest files. Use Fix app to clear only the Ubuzima+ app cache and reopen.');
              openSafeMode('asset-load-failed', 1600);
            }
          },
          true
        );

        window.addEventListener('ubuzima:pwa-asset-failed', function () {
          showRecovery('The installed app cache is stale. Use Fix app to refresh the Ubuzima+ app without changing the rest of the system.');
          openSafeMode('stale-app-cache', 1600);
        });

        window.setTimeout(function () {
          var root = rootNode();

          if (root && !appIsReady()) {
            showRecovery('The app is taking longer than expected to open. Use Fix app to refresh only the installed Ubuzima+ app cache.');
            openSafeMode('startup-timeout', 2600);
          }
        }, 9000);
      })();
    </script>

/*
 * UBUZIMA+ N3A-R2
 *
 * Canonical module navigation stability controller.
 *
 * Finance is a native workspace of the Admin SPA.
 *
 * The retired /admin-finance/ path is never used as an internal
 * navigation destination.
 *
 * Existing React and Deck navigation ownership remains intact.
 */

(function installUbuzimaNavigationStabilityN3AR2() {
  'use strict';

  var root = document.documentElement;

  if (root.dataset.ubzNavigationStabilityN3ar2 === '1') {
    return;
  }

  root.dataset.ubzNavigationStabilityN3ar2 = '1';

  if ('scrollRestoration' in window.history) {
    window.history.scrollRestoration = 'manual';
  }

  var scheduled = false;

  function primaryScrollOwner() {
    return (
      document.querySelector('.dashboard-scroll-panel')
      || document.querySelector('.module-page-scroll-content')
      || null
    );
  }

  function resetPrimaryScroll() {
    var owner = primaryScrollOwner();

    if (owner) {
      owner.scrollTop = 0;
      owner.scrollLeft = 0;
      return;
    }

    window.scrollTo({
      top: 0,
      left: 0,
      behavior: 'auto'
    });
  }

  function scheduleScrollReset() {
    if (scheduled) {
      return;
    }

    scheduled = true;

    window.requestAnimationFrame(function () {
      scheduled = false;
      resetPrimaryScroll();
    });
  }

  function canonicalFinanceHash() {
    var state = new URLSearchParams(
      window.location.hash.replace(/^#/, '')
    );

    state.set('section', 'finance');
    state.set('finance', 'overview');
    state.set('scrollY', '0');

    return '#' + state.toString();
  }

  function isLegacyFinanceAnchor(anchor) {
    if (!(anchor instanceof HTMLAnchorElement)) {
      return false;
    }

    if (!anchor.href) {
      return false;
    }

    try {
      var url = new URL(
        anchor.href,
        window.location.href
      );

      var path = url.pathname.replace(
        /\/+$/,
        ''
      );

      return path === '/admin-finance';
    } catch (error) {
      return false;
    }
  }

  document.addEventListener(
    'click',
    function (event) {
      var target = event.target;

      if (!(target instanceof Element)) {
        return;
      }

      var anchor = target.closest('a[href]');

      /*
       * Only the obsolete Finance URL is intercepted.
       *
       * Normal Deck / React navigation is not replaced.
       */
      if (
        anchor
        && isLegacyFinanceAnchor(anchor)
      ) {
        event.preventDefault();
        event.stopImmediatePropagation();

        window.location.hash =
          canonicalFinanceHash();

        scheduleScrollReset();

        return;
      }

      var deck = target.closest(
        '[data-ubuzima-workspace-dock],'
        + '#ubz-global-deck-header-r5113'
      );

      if (!deck) {
        return;
      }

      var control = target.closest(
        'button,a,[role="button"]'
      );

      if (
        !control
        || !deck.contains(control)
      ) {
        return;
      }

      /*
       * Existing Deck handler performs the navigation.
       *
       * N3A-R2 performs only one bounded post-navigation scroll
       * normalization.
       */
      scheduleScrollReset();
    },
    true
  );

  window.addEventListener(
    'hashchange',
    scheduleScrollReset,
    { passive: true }
  );

  window.addEventListener(
    'popstate',
    scheduleScrollReset,
    { passive: true }
  );

  window.addEventListener(
    'pageshow',
    function (event) {
      if (event.persisted) {
        scheduleScrollReset();
      }
    },
    { passive: true }
  );
})();
