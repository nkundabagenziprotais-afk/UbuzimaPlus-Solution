<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <title>Refresh UbuzimaPlus Admin</title>
</head>
<body>
  <p>Refreshing UbuzimaPlus Admin…</p>

  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations =
            await navigator.serviceWorker.getRegistrations();

          await Promise.all(
            registrations.map(
              registration => registration.unregister(),
            ),
          );
        }

        if ('caches' in window) {
          const keys = await caches.keys();

          await Promise.all(
            keys.map(key => caches.delete(key)),
          );
        }
      } finally {
        window.location.replace(
          '/admin/?release=pharmacist-procurement-8a0c037',
        );
      }
    })();
  </script>
</body>
</html>
