name: Android Approved PWA Wrapper

on:
  push:
    branches:
      - feature/android-approved-pwa-clean-wrapper-20260911
    paths:
      - 'mobile/android-approved-pwa-wrapper/**'
      - '.github/workflows/android-approved-pwa-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build clean PWA wrapper APK
        run: |
          gradle -p mobile/android-approved-pwa-wrapper :app:assembleDebug --stacktrace

      - name: Verify package has no bundled Codex web UI
        run: |
          APK='mobile/android-approved-pwa-wrapper/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -l "$APK" > /tmp/apk-files.txt
          if grep -Eq 'assets/public|index-BBD3O3on\.js|dashboard-shell--fresh-mobile-app|ubuzima-native-topbar' /tmp/apk-files.txt; then
            echo 'Bundled legacy UI detected'
            exit 1
          fi
          mkdir -p dist
          cp "$APK" 'dist/ubuzima-admin-approved-pwa-uat-v2.apk'
          sha256sum 'dist/ubuzima-admin-approved-pwa-uat-v2.apk' | tee 'dist/ubuzima-admin-approved-pwa-uat-v2.apk.sha256'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuzima-admin-approved-pwa-uat-v2
          path: |
            dist/ubuzima-admin-approved-pwa-uat-v2.apk
            dist/ubuzima-admin-approved-pwa-uat-v2.apk.sha256
          retention-days: 30

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-approved-pwa-uat-v2
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ubuzima-admin-approved-pwa-uat-v2.apk dist/ubuzima-admin-approved-pwa-uat-v2.apk.sha256 --clobber
          else
            gh release create "$TAG" dist/ubuzima-admin-approved-pwa-uat-v2.apk dist/ubuzima-admin-approved-pwa-uat-v2.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title 'Ubuzima+ Android Approved PWA UAT v2' \
              --notes 'Clean Android WebView wrapper for device UAT. It contains no bundled Codex frontend and loads the approved LIVE PWA endpoint. Package ID: com.ubuzimaplus.admin.pwa, so it can be installed alongside the existing Android app for comparison.'
          fi
