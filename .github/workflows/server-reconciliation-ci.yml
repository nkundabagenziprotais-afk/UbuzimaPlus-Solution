name: Ubuzima+ Server Reconciliation CI

on:
  push:
    branches:
      - "feature/ubuzimaplus-server-reconciliation-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend-static:
    name: PHP 8.3 / Laravel boot and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/backend/database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log

    steps:
      - name: Checkout reconciliation candidate
        uses: actions/checkout@v4

      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring,bcmath,curl,dom,fileinfo,gd,intl,pdo_sqlite,sqlite3,xml,zip
          coverage: none

      - name: Prepare isolated Laravel environment
        run: |
          cp .env.example .env
          mkdir -p database
          : > database/database.sqlite

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate disposable CI application key
        run: php artisan key:generate --force

      - name: PHP syntax validation
        run: |
          find app bootstrap config database/migrations routes \
            -type f \
            -name '*.php' \
            -print0 \
          | xargs -0 -n1 php -l

      - name: Laravel bootstrap validation
        run: php artisan about --only=environment

      - name: API route registration validation
        run: php artisan route:list --path=api

  backend-tests:
    name: Laravel test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/backend/database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log

    steps:
      - name: Checkout reconciliation candidate
        uses: actions/checkout@v4

      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring,bcmath,curl,dom,fileinfo,gd,intl,pdo_sqlite,sqlite3,xml,zip
          coverage: none

      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          mkdir -p database
          : > database/database.sqlite

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate disposable CI application key
        run: php artisan key:generate --force

      - name: Run Laravel test suite
        run: php artisan test

  disposable-migration:
    name: Disposable SQLite migration compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/backend/database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log

    steps:
      - name: Checkout reconciliation candidate
        uses: actions/checkout@v4

      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring,bcmath,curl,dom,fileinfo,gd,intl,pdo_sqlite,sqlite3,xml,zip
          coverage: none

      - name: Prepare empty disposable SQLite database
        run: |
          cp .env.example .env
          mkdir -p database
          : > database/database.sqlite

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate disposable CI application key
        run: php artisan key:generate --force

      - name: Run migration chain on disposable CI database only
        run: |
          echo "CI_DATABASE_ONLY=YES"
          echo "PRODUCTION_MIGRATION_APPROVAL=NO"
          php artisan migrate --force

      - name: Show disposable migration status
        run: php artisan migrate:status

  admin-dashboard:
    name: Admin dashboard typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web/admin-dashboard

    steps:
      - name: Checkout reconciliation candidate
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/admin-dashboard/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Typecheck and build admin dashboard
        run: npm run check

  public-website:
    name: Public website build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web/public-website

    steps:
      - name: Checkout reconciliation candidate
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/public-website/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build public website
        run: npm run build
