name: Ubuzima+ Android 3.2.0 Preview

on:
  workflow_dispatch:
  push:
    branches:
      - release/ubuzima-mobile-3.2.0
    paths:
      - "mobile/ubuzima_native/**"
      - ".github/workflows/ubuzima-mobile-3-2-0-preview.yml"

permissions:
  contents: read

concurrency:
  group: ubuzima-mobile-3-2-0-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-preview:
    name: Android 3.2.0 Preview
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: mobile/ubuzima_native

    steps:
      - name: Checkout Ubuzima+ 3.2.0
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Flutter environment
        run: |
          set -Eeuo pipefail
          flutter --version
          dart --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Format verification
        run: dart format --output=none --set-exit-if-changed lib/src/app/ubuzima_app.dart lib/src/core/theme/ubuzima_brand.dart lib/src/shared/presentation/ubuzima_brand_logo.dart lib/src/features/auth/presentation/auth_gate.dart lib/src/features/auth/presentation/native_login_screen.dart lib/src/features/home/presentation/native_home_screen.dart lib/src/features/update/data/preview_update_service.dart test/preview_update_service_test.dart

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Native domain tests
        run: flutter test --no-pub --concurrency=1

      - name: Enforce native source contract
        shell: bash
        run: |
          set -Eeuo pipefail

          if grep -RniE 'webview_flutter|flutter_inappwebview' lib pubspec.yaml pubspec.lock
          then
            echo "FAIL=WEBVIEW_PACKAGE_FOUND"
            exit 1
          fi

          if grep -RniE '\b(WebViewWidget|WebViewController|InAppWebView|InAppWebViewController|WKWebView|AndroidWebView)\b' lib
          then
            echo "FAIL=WEBVIEW_CLASS_FOUND"
            exit 1
          fi

          if grep -RniE 'ubuzima-plus-mobile-3-1-0|admin-preview-cursor|ubuzima_shell=pwa|ubuzima_native=capacitor' lib pubspec.yaml
          then
            echo "FAIL=LEGACY_WEB_RUNTIME_FOUND"
            exit 1
          fi

          echo "NATIVE_SOURCE_CONTRACT=PASS"

      - name: Enforce Preview updater contract
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -F \
            'https://ubuzimaplus.com/downloads/preview-update.json' \
            lib/src/features/update/data/preview_update_service.dart

          grep -F \
            'com.ubuzimaplus.preview' \
            lib/src/features/update/data/preview_update_service.dart

          grep -F \
            'android.permission.REQUEST_INSTALL_PACKAGES' \
            android/app/src/main/AndroidManifest.xml

          grep -F \
            'androidx.core.content.FileProvider' \
            android/app/src/main/AndroidManifest.xml

          grep -F \
            '@xml/preview_update_paths' \
            android/app/src/main/AndroidManifest.xml

          grep -R -F \
            'com.ubuzimaplus.preview/update' \
            lib android/app/src/main

          grep -R -F \
            'f29865dbb2b733cce6cf821d358b5ca5652653dcc25af15a0d5a5272d83d3671' \
            android/app/src/main

          if grep -R -F \
            'file://' \
            lib/src/features/update \
            android/app/src/main
          then
            echo "FAIL=FILE_URI_FOUND_IN_PREVIEW_UPDATER"
            exit 1
          fi

          if grep -R -F \
            'com.ubuzimaplus.app' \
            lib/src/features/update \
            android/app/src/main/kotlin/com/ubuzimaplus/preview/MainActivity.kt
          then
            echo "FAIL=COMMERCIAL_PACKAGE_REFERENCED_BY_PREVIEW_UPDATER"
            exit 1
          fi

          echo "PREVIEW_UPDATER_SOURCE_CONTRACT=PASS"

      - name: Prepare permanent Preview signing
        shell: bash
        env:
          UBIZIMA_PREVIEW_KEYSTORE_B64: ${{ secrets.UBIZIMA_PREVIEW_KEYSTORE_B64 }}
        run: |
          set -Eeuo pipefail
          umask 077

          test -n "$UBIZIMA_PREVIEW_KEYSTORE_B64"

          KEYSTORE="$RUNNER_TEMP/ubuzima-preview-release.p12"

          printf '%s' "$UBIZIMA_PREVIEW_KEYSTORE_B64" |
            base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          echo "UBIZIMA_PREVIEW_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "PERMANENT_PREVIEW_KEYSTORE=READY"

      - name: Build optimized Android ARM64 release
        env:
          UBIZIMA_PREVIEW_STORE_PASSWORD: ${{ secrets.UBIZIMA_PREVIEW_STORE_PASSWORD }}
          UBIZIMA_PREVIEW_KEY_ALIAS: ${{ secrets.UBIZIMA_PREVIEW_KEY_ALIAS }}
          UBIZIMA_PREVIEW_KEY_PASSWORD: ${{ secrets.UBIZIMA_PREVIEW_KEY_PASSWORD }}
          UBIZIMA_PREVIEW_STORE_TYPE: ${{ secrets.UBIZIMA_PREVIEW_STORE_TYPE }}
        run: |
          set -Eeuo pipefail

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols \
            --no-pub

      - name: Verify permanent Preview signer
        shell: bash
        env:
          EXPECTED_PREVIEW_CERT_SHA256: ${{ secrets.UBIZIMA_PREVIEW_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          SIGNER_REPORT="$RUNNER_TEMP/ubuzima-preview-apksigner.txt"
          KNOWN_PREVIEW_CERT_SHA256="f29865dbb2b733cce6cf821d358b5ca5652653dcc25af15a0d5a5272d83d3671"

          test -s "$APK"

          EXPECTED="$(
            printf '%s' "$EXPECTED_PREVIEW_CERT_SHA256" |
            tr -d '[:space:]:-' |
            tr 'A-F' 'a-f'
          )"

          if ! printf '%s' "$EXPECTED" |
            grep -Eq '^[0-9a-f]{64}$'
          then
            echo "FAIL=PREVIEW_CERT_SECRET_FORMAT"
            exit 1
          fi

          if [ "$EXPECTED" != "$KNOWN_PREVIEW_CERT_SHA256" ]
          then
            echo "FAIL=PREVIEW_CERT_SECRET_DOES_NOT_MATCH_PINNED_CERT"
            exit 1
          fi

          echo "PREVIEW_CERT_SECRET_CONSISTENCY=PASS"

          ANDROID_SDK_BASE="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$ANDROID_SDK_BASE" ]
          then
            echo "FAIL=ANDROID_SDK_ROOT_NOT_AVAILABLE"
            exit 1
          fi

          if [ ! -d "$ANDROID_SDK_BASE/build-tools" ]
          then
            echo "FAIL=ANDROID_BUILD_TOOLS_DIRECTORY_MISSING"
            exit 1
          fi

          APKSIGNER="$(
            find "$ANDROID_SDK_BASE/build-tools"               -type f               -name apksigner               -perm -111               -print |
            sort -V |
            tail -n 1
          )"

          if [ -z "$APKSIGNER" ]
          then
            echo "FAIL=APKSIGNER_NOT_FOUND"
            exit 1
          fi

          if [ ! -x "$APKSIGNER" ]
          then
            echo "FAIL=APKSIGNER_NOT_EXECUTABLE"
            exit 1
          fi

          echo "APKSIGNER_DISCOVERY=PASS"

          set +e

          "$APKSIGNER"             verify             --print-certs             "$APK"             > "$SIGNER_REPORT"             2>&1

          APKSIGNER_EXIT=$?

          set -e

          echo "APKSIGNER_VERIFY_EXIT=$APKSIGNER_EXIT"

          echo "APKSIGNER_REPORT_BEGIN"
          cat "$SIGNER_REPORT"
          echo "APKSIGNER_REPORT_END"

          if [ "$APKSIGNER_EXIT" -ne 0 ]
          then
            echo "FAIL=APKSIGNER_VERIFY_FAILED"
            exit "$APKSIGNER_EXIT"
          fi

          if [ ! -s "$SIGNER_REPORT" ]
          then
            echo "FAIL=APKSIGNER_REPORT_EMPTY"
            exit 1
          fi

          CERT_DIGEST_COUNT="$(
            grep -Eic               'certificate[[:space:]]+SHA-256[[:space:]]+digest[[:space:]]*:'               "$SIGNER_REPORT" ||
            true
          )"

          echo "APK_CERT_DIGEST_LINE_COUNT=$CERT_DIGEST_COUNT"

          if [ "$CERT_DIGEST_COUNT" -ne 1 ]
          then
            echo "FAIL=UNEXPECTED_APK_CERT_DIGEST_COUNT"
            exit 1
          fi

          ACTUAL="$(
            grep -Ei 'certificate[[:space:]]+SHA-256[[:space:]]+digest[[:space:]]*:' "$SIGNER_REPORT" |
            sed -E 's/^.*digest[[:space:]]*:[[:space:]]*//' |
            tr -d '[:space:]:-' |
            tr 'A-F' 'a-f'
          )"

          if [ -z "$ACTUAL" ]
          then
            echo "FAIL=PREVIEW_CERT_DIGEST_EMPTY"
            exit 1
          fi

          if ! printf '%s' "$ACTUAL" |
            grep -Eq '^[0-9a-f]{64}$'
          then
            echo "FAIL=PREVIEW_CERT_DIGEST_INVALID"
            exit 1
          fi

          echo "ANDROID_PREVIEW_CERT_DIGEST_PARSED=YES"

          if [ "$ACTUAL" != "$EXPECTED" ]
          then
            echo "ANDROID_PREVIEW_CERT_MATCH=FAIL"
            echo "FAIL=UNEXPECTED_PREVIEW_SIGNING_CERTIFICATE"
            exit 1
          fi

          if [ "$ACTUAL" != "$KNOWN_PREVIEW_CERT_SHA256" ]
          then
            echo "ANDROID_PREVIEW_CERT_PIN_MATCH=FAIL"
            echo "FAIL=PREVIEW_SIGNING_CERT_PIN_MISMATCH"
            exit 1
          fi

          echo "ANDROID_PREVIEW_CERT_MATCH=PASS"
          echo "ANDROID_PREVIEW_CERT_PIN_MATCH=PASS"
          echo "ANDROID_PREVIEW_SIGNER=PASS"

      - name: Verify optimized APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          BASELINE_BYTES=85126485
          MAX_BYTES=45000000

          test -s "$APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name 'aapt' -perm -111 -print | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -x "$AAPT"

          "$AAPT" dump badging "$APK" > /tmp/badging.txt

          grep -F "package: name='com.ubuzimaplus.preview'" /tmp/badging.txt
          grep -F "application-label:'Ubuzima+ Preview'" /tmp/badging.txt
          grep -F "versionCode='32004'" /tmp/badging.txt
          grep -F "versionName='3.2.0-rc.4'" /tmp/badging.txt

          unzip -Z1 "$APK" > /tmp/apk-list.txt

          grep -Fx 'lib/arm64-v8a/libflutter.so' /tmp/apk-list.txt
          grep -Fx 'lib/arm64-v8a/libapp.so' /tmp/apk-list.txt

          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' /tmp/apk-list.txt
          then
            echo "UNEXPECTED_ANDROID_ABI_PATHS_BEGIN"
            grep -E '^lib/(armeabi-v7a|x86|x86_64)/' /tmp/apk-list.txt | sort
            echo "UNEXPECTED_ANDROID_ABI_PATHS_END"

            echo "NATIVE_ABI_DIRECTORIES_BEGIN"
            awk -F/ '/^lib\/[^/]+\/[^/]+\.so$/ {print $2}' /tmp/apk-list.txt | sort -u
            echo "NATIVE_ABI_DIRECTORIES_END"

            echo "FLUTTER_CORE_LIBRARIES_BEGIN"
            grep -E '^lib/[^/]+/(libflutter|libapp)\.so$' /tmp/apk-list.txt | sort || true
            echo "FLUTTER_CORE_LIBRARIES_END"

            echo "AAPT_NATIVE_CODE_BEGIN"
            "$AAPT" dump badging "$APK" | grep '^native-code:' || true
            echo "AAPT_NATIVE_CODE_END"

            echo "ABI_DIAGNOSTIC_APK_BYTES=$(stat -c '%s' "$APK")"
            echo "ABI_DIAGNOSTIC_APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"

            echo "FAIL=UNEXPECTED_ANDROID_ABI"
            exit 1
          fi

          rm -rf /tmp/ubuzima-plus-apk
          mkdir -p /tmp/ubuzima-plus-apk
          unzip -qq "$APK" -d /tmp/ubuzima-plus-apk

          : > /tmp/dex-strings.txt
          find /tmp/ubuzima-plus-apk -maxdepth 1 -type f -name 'classes*.dex' -print |
          while IFS= read -r dex
          do
            strings "$dex" >> /tmp/dex-strings.txt
          done

          if ! grep -Fq 'com/ubuzimaplus/preview/MainActivity' /tmp/dex-strings.txt
          then
            echo "FAIL=ANDROID_LAUNCH_ACTIVITY_MISSING"
            exit 1
          fi

          echo "ANDROID_LAUNCH_ACTIVITY=PASS"

          if grep -Eiq 'webview_flutter|flutter_inappwebview|io/flutter/plugins/webviewflutter|com/pichillilorenzo/flutter_inappwebview' /tmp/dex-strings.txt
          then
            echo "FAIL=WEBVIEW_PLUGIN_FOUND_IN_APK"
            exit 1
          fi

          strings /tmp/ubuzima-plus-apk/lib/arm64-v8a/libapp.so > /tmp/libapp-strings.txt

          grep -F 'https://ubuzimaplus.com' /tmp/libapp-strings.txt

          if grep -Eiq 'ubuzima-plus-mobile-3-1-0|admin-preview-cursor|ubuzima_shell=pwa|ubuzima_native=capacitor' /tmp/libapp-strings.txt
          then
            echo "FAIL=LEGACY_WEB_RUNTIME_FOUND_IN_COMPILED_APP"
            exit 1
          fi

          BYTES="$(stat -c '%s' "$APK")"

          echo "ANDROID_PREVIEW_BYTES=$BYTES"
          awk -v b="$BYTES" 'BEGIN {printf "ANDROID_PREVIEW_MB=%.2f\n",b/1024/1024}'
          awk -v old="$BASELINE_BYTES" -v new="$BYTES" 'BEGIN {printf "SIZE_REDUCTION_PERCENT=%.2f\n",((old-new)/old)*100}'

          if [ "$BYTES" -gt "$MAX_BYTES" ]
          then
            echo "FAIL=APK_EXCEEDS_45MB_SIZE_GATE"
            exit 1
          fi

          echo "COMPILED_WEBVIEW_PLUGIN_HITS=0"
          echo "DIRECT_NATIVE_API_CLIENT=YES"
          echo "ANDROID_RELEASE_SIZE_GATE=PASS"

      - name: Create release checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > ubuzima-plus-android-3.2.0-rc4-arm64-release.sha256
          cat ubuzima-plus-android-3.2.0-rc4-arm64-release.sha256

      - name: Upload Ubuzima+ Android Preview
        uses: actions/upload-artifact@v4
        with:
          name: ubuzima-plus-android-3.2.0-rc4-arm64-release
          path: |
            mobile/ubuzima_native/build/app/outputs/flutter-apk/app-release.apk
            mobile/ubuzima_native/build/app/outputs/flutter-apk/ubuzima-plus-android-3.2.0-rc4-arm64-release.sha256
          if-no-files-found: error
          retention-days: 7
