name: Ubuzima+ Native R1 Android UAT

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ubuzima-native-r1
    paths:
      - "mobile/ubuzima_native/**"
      - ".github/workflows/ubuzima-native-r1-uat.yml"

permissions:
  contents: read

concurrency:
  group: ubuzima-native-r1-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native-uat:
    name: Android Native UAT
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile/ubuzima_native

    steps:
      - name: Checkout Native R1
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Flutter environment
        run: |
          set -Eeuo pipefail
          flutter --version
          dart --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Format verification
        run: dart format --output=none --set-exit-if-changed lib/src/app/ubuzima_app.dart lib/src/core/theme/ubuzima_brand.dart lib/src/shared/presentation/ubuzima_brand_logo.dart lib/src/features/auth/presentation/auth_gate.dart lib/src/features/auth/presentation/native_login_screen.dart lib/src/features/home/presentation/native_home_screen.dart

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Native domain tests
        run: flutter test --no-pub --concurrency=1

      - name: Enforce no-WebView source contract
        shell: bash
        run: |
          set -Eeuo pipefail

          if grep -RniE \
            'webview_flutter|flutter_inappwebview' \
            lib pubspec.yaml pubspec.lock
          then
            echo "FAIL=WEBVIEW_PACKAGE_FOUND"
            exit 1
          fi

          if grep -RniE \
            '\b(WebViewWidget|WebViewController|InAppWebView|InAppWebViewController|WKWebView|AndroidWebView)\b' \
            lib
          then
            echo "FAIL=WEBVIEW_CLASS_FOUND"
            exit 1
          fi

          if grep -RniE \
            'ubuzima-plus-mobile-3-1-0|admin-preview-cursor|ubuzima_shell=pwa|ubuzima_native=capacitor' \
            lib pubspec.yaml
          then
            echo "FAIL=LEGACY_WEB_RUNTIME_FOUND"
            exit 1
          fi

          echo "NO_WEBVIEW_SOURCE_GATE=PASS"

      - name: Build Android ARM64 debug UAT
        run: |
          set -Eeuo pipefail

          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --no-pub

      - name: Verify APK identity and architecture
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          test -s "$APK"

          AAPT="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name 'aapt' \
              -perm -111 \
              -print |
            sort -V |
            tail -n 1
          )"

          test -n "$AAPT"
          test -x "$AAPT"

          "$AAPT" dump badging "$APK" > /tmp/badging.txt

          grep -F \
            "package: name='com.ubuzimaplus.nativeuat'" \
            /tmp/badging.txt

          grep -F \
            "application-label:'Ubuzima+ Native UAT'" \
            /tmp/badging.txt

          unzip -Z1 \
            "$APK" \
            > /tmp/apk-list.txt

          grep -E \
            '^lib/arm64-v8a/libflutter\.so$' \
            /tmp/apk-list.txt

          grep -F \
            'assets/flutter_assets/kernel_blob.bin' \
            /tmp/apk-list.txt

          rm -rf /tmp/ubuzima-native-apk
          mkdir -p /tmp/ubuzima-native-apk

          unzip -qq \
            "$APK" \
            -d /tmp/ubuzima-native-apk

          : > /tmp/dex-strings.txt

          find /tmp/ubuzima-native-apk \
            -maxdepth 1 \
            -type f \
            -name 'classes*.dex' \
            -print |
          while IFS= read -r dex
          do
            strings "$dex" >> /tmp/dex-strings.txt
          done

          if grep -Eiq \
            'webview_flutter|flutter_inappwebview|io/flutter/plugins/webviewflutter|com/pichillilorenzo/flutter_inappwebview' \
            /tmp/dex-strings.txt
          then
            echo "FAIL=WEBVIEW_PLUGIN_FOUND_IN_APK"
            exit 1
          fi

          KERNEL="/tmp/ubuzima-native-apk/assets/flutter_assets/kernel_blob.bin"

          test -s "$KERNEL"

          strings "$KERNEL" \
            > /tmp/kernel-strings.txt

          grep -F \
            'https://ubuzimaplus.com' \
            /tmp/kernel-strings.txt

          if grep -Eiq \
            'ubuzima-plus-mobile-3-1-0|admin-preview-cursor|ubuzima_shell=pwa|ubuzima_native=capacitor' \
            /tmp/kernel-strings.txt
          then
            echo "FAIL=LEGACY_WEB_RUNTIME_FOUND_IN_COMPILED_APP"
            exit 1
          fi

          echo "COMPILED_WEBVIEW_PLUGIN_HITS=0"
          echo "DIRECT_NATIVE_API_CLIENT=YES"
          echo "APK_ARCHITECTURE_GATE=PASS"

      - name: Create APK checksum
        shell: bash
        run: |
          set -Eeuo pipefail

          cd build/app/outputs/flutter-apk

          sha256sum \
            app-debug.apk \
            > ubuzima-plus-native-r1-uat-debug-arm64.sha256

          cat ubuzima-plus-native-r1-uat-debug-arm64.sha256

      - name: Upload Native R1 UAT APK
        uses: actions/upload-artifact@v4
        with:
          name: ubuzima-plus-native-r1-uat-debug-arm64
          path: |
            mobile/ubuzima_native/build/app/outputs/flutter-apk/app-debug.apk
            mobile/ubuzima_native/build/app/outputs/flutter-apk/ubuzima-plus-native-r1-uat-debug-arm64.sha256
          if-no-files-found: error
          retention-days: 7
